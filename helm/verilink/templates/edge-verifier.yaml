{{- if .Values.edgeVerifier.enabled }}
{{- if eq .Values.edgeVerifier.kind "DaemonSet" }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "verilink.edgeVerifier.fullname" . }}
  labels:
    {{- include "verilink.labels" . | nindent 4 }}
    {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: edge-verifier
          image: {{ include "verilink.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.edgeVerifier.image.repository "tag" (.Values.edgeVerifier.image.tag | default .Chart.AppVersion) "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.edgeVerifier.image.pullPolicy }}
          args:
            - -control-plane-url
            - {{ .Values.edgeVerifier.env.controlPlaneUrl | quote }}
            - -trust-engine-addr
            - {{ .Values.edgeVerifier.env.trustEngineAddr | quote }}
            - -api-key
            - $(API_KEY)
            - -sync-enabled
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "verilink.edgeVerifier.fullname" . }}-secrets
                  key: apiKey
          ports:
            - name: http
              containerPort: {{ .Values.edgeVerifier.port }}
              protocol: TCP
          {{- with .Values.edgeVerifier.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- else }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verilink.edgeVerifier.fullname" . }}
  labels:
    {{- include "verilink.labels" . | nindent 4 }}
    {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.edgeVerifier.replicaCount }}
  selector:
    matchLabels:
      {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: edge-verifier
          image: {{ include "verilink.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.edgeVerifier.image.repository "tag" (.Values.edgeVerifier.image.tag | default .Chart.AppVersion) "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ .Values.edgeVerifier.image.pullPolicy }}
          args:
            - -control-plane-url
            - {{ .Values.edgeVerifier.env.controlPlaneUrl | quote }}
            - -trust-engine-addr
            - {{ .Values.edgeVerifier.env.trustEngineAddr | quote }}
            - -api-key
            - $(API_KEY)
            - -sync-enabled
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "verilink.edgeVerifier.fullname" . }}-secrets
                  key: apiKey
          ports:
            - name: http
              containerPort: {{ .Values.edgeVerifier.port }}
              protocol: TCP
          {{- with .Values.edgeVerifier.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verilink.edgeVerifier.fullname" . }}
  labels:
    {{- include "verilink.labels" . | nindent 4 }}
spec:
  type: {{ .Values.edgeVerifier.service.type }}
  ports:
    - name: http
      port: {{ .Values.edgeVerifier.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "verilink.edgeVerifier.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "verilink.edgeVerifier.fullname" . }}-secrets
  labels:
    {{- include "verilink.labels" . | nindent 4 }}
type: Opaque
stringData:
  apiKey: {{ .Values.edgeVerifier.env.apiKey | quote }}
{{- end }}
