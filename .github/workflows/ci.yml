name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            golangci-lint run --timeout 5m --new-from-rev=origin/main --whole-files
          else
            golangci-lint run --timeout 5m --new-from-rev="${{ github.event.before }}" --whole-files
          fi

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Secrets scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Cyclomatic complexity
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only origin/main...HEAD -- '*.go')"
          else
            files="$(git diff --name-only "${{ github.event.before }}"...HEAD -- '*.go')"
          fi
          if [ -z "$files" ]; then
            exit 0
          fi
          printf '%s\n' "$files" | grep -v '^internal/trustengine/service.go$' | xargs -r gocyclo -over 25

  proto:
    name: Proto
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: cd proto && buf lint

      - name: Check generated code
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          cd proto
          buf generate --template ../buf.gen.yaml
          cd ..
          "$(go env GOPATH)/bin/goimports" -w pkg/trustpb/trust.pb.go pkg/trustpb/trust_grpc.pb.go
          git diff --exit-code -- pkg/trustpb

  go-integration:
    name: Go integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (integration)
        run: go test -tags=integration -count=1 ./...

  control-plane-integration:
    name: Control plane integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: control-plane

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verilink
          POSTGRES_PASSWORD: verilink
          POSTGRES_DB: verilink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U verilink -d verilink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://verilink:verilink@127.0.0.1:5432/verilink_test
          API_KEY_HMAC_SECRET: test-hmac-secret-for-integration
        run: npm run test:integration
