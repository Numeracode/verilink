name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            golangci-lint run --timeout 5m --new-from-rev=origin/main --whole-files
          else
            golangci-lint run --timeout 5m --new-from-rev="${{ github.event.before }}" --whole-files
          fi

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: Build
        run: go build ./...

      - name: Secrets scan
        run: |
          go install github.com/zricethezav/gitleaks/v8/cmd/gitleaks@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Cyclomatic complexity
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(git diff --name-only origin/main...HEAD -- '*.go')"
          else
            files="$(git diff --name-only "${{ github.event.before }}"...HEAD -- '*.go')"
          fi
          if [ -z "$files" ]; then
            exit 0
          fi
          printf '%s\n' "$files" | grep -v '^internal/trustengine/service.go$' | xargs -r gocyclo -over 25

  proto:
    name: Proto
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Lint protos
        run: cd proto && buf lint

      - name: Check generated code
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          cd proto
          buf generate --template ../buf.gen.yaml
          cd ..
          "$(go env GOPATH)/bin/goimports" -w pkg/trustpb/trust.pb.go pkg/trustpb/trust_grpc.pb.go
          git diff --exit-code -- pkg/trustpb
