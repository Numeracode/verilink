version: v1

# Local plugins — avoid buf.build remote plugin registry outages in CI.
# Versions must match go.mod protobuf/grpc and the previously pinned BSR tags.
plugins:
  - plugin: go
    out: ..
    opt:
      - module=github.com/messagesgoel-blip/verilink
  - plugin: go-grpc
    out: ..
    opt:
      - module=github.com/messagesgoel-blip/verilink
